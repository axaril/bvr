[package]
name = "bvr"
description = "A pager designed to help you chew through logs."
categories = ["command-line-utilities"]
authors = ["An Tran <antranprm@gmail.com>"]
version = "0.0.6"
edition = "2024"
license = "MIT"
keywords = ["cli", "pager"]
homepage = "https://github.com/Avarel/bvr"
repository = "https://github.com/Avarel/bvr"
readme = "README.md"

exclude = [
  "HomebrewFormula",
  "/.github/",
  "/ci/",
  "/pkg/",
  "/benchsuite/",
  "/scripts/",
]

[[bin]]
bench = false
name = "bvr"

[workspace]
members = ["crates/core", "crates/test_gen"]

[workspace.dependencies]
regex = "1.12"
lru = "0.18"

[dependencies]
bvr-core = { version = "0.0.4", path = "crates/core" }

# UI
anyhow = "1.0"
clap = { version = "4.6", features = ["cargo", "derive"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty", "osc52"] }
ratatui = { version = "0.30", features = ["serde", "layout-cache"] }
regex = { workspace = true }
itoa = "1.0"
bitflags = "2.11"
lru = { workspace = true }
supports-color = "3.0"
unicode-width = "0.2"
unicode-segmentation = "1.13"

# Shell usage
shellexpand = "3.1"
shlex = "2.0"

# Data storage
directories-next = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.flamegraph]
inherits = "release"
debug = true
strip = false
