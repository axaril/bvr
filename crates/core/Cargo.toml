[package]
name = "bvr-core"
description = "The core components used for the bvr pager."
authors = ["An Tran <antranprm@gmail.com>"]
version = "0.0.4"
edition = "2021"
license = "MIT"
readme = "README.md"

[dependencies]
thiserror = "2.0"
memchr = "2.8"
memmap2 = "0.9"
lru = { workspace = true }
regex = { workspace = true }
arc-swap = "1.9"
tempfile = "3.27"
rayon = "1.12"

[dev-dependencies]
anyhow = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "indexing"
harness = false

[[bench]]
name = "access"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "filters"
harness = false
